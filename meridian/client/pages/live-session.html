<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meridian - Live Session</title>
    <meta name="description" content="Meridian live practice session">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="/js/lib/themeInit.js"></script>
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/pages/live-session.css">
</head>
<body>

    <!-- Theme toggle -->
    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
        <span id="theme-icon"></span>
    </button>

    <!-- Toast notification -->
    <div id="toast" class="toast" role="status" aria-live="polite">Microphone muted</div>

    <!-- Session view -->
    <main class="session" id="session-view">
        <!-- AI Video Area -->
        <div class="session__frame">
            <div class="session__surface">
                <div class="persona">
                    <div class="persona__avatar">
                        <svg viewBox="0 0 24 24">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </div>
                    <span id="persona-status" class="persona__label">Connecting...</span>
                </div>
            </div>
        </div>

        <!-- User PIP -->
        <div class="pip" id="pip">
            <div class="pip__inner">
                <video id="pip-video" class="pip__video" autoplay muted playsinline></video>
                <div id="pip-avatar" class="pip__avatar">
                    <svg viewBox="0 0 24 24">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </div>
                <span id="pip-label" class="pip__label">You</span>
            </div>
        </div>
    </main>

    <!-- Live Captions -->
    <div id="captions" class="captions" aria-live="polite">
        <span id="captions-text" class="captions__text"></span>
    </div>

    <!-- Control bar -->
    <div class="controls" id="controls">
        <div class="controls__bar">
            <!-- Mic group -->
            <div class="controls__mic-group">
                <button id="mic-toggle" class="btn-circle controls__mic" aria-label="Toggle microphone">
                    <svg id="mic-on-icon" viewBox="0 0 24 24">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                        <line x1="12" y1="19" x2="12" y2="23"></line>
                    </svg>
                    <svg id="mic-off-icon" class="hidden" viewBox="0 0 24 24">
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                        <path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"></path>
                        <path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2c0 .76-.13 1.49-.36 2.18"></path>
                        <line x1="12" y1="19" x2="12" y2="23"></line>
                    </svg>
                </button>
            </div>

            <!-- Timer -->
            <div class="controls__timer">
                <div class="status-dot"></div>
                <span id="timer-text" class="controls__timer-text">00:00</span>
            </div>

            <!-- End session -->
            <button id="end-btn" class="btn-pill btn-pill--danger" aria-label="End session">End</button>
        </div>
    </div>

    <!-- Session ended overlay -->
    <div id="session-ended" class="session-ended">
        <h2 class="session-ended__title">Session ended</h2>
        <p class="session-ended__message">Your conversation has been saved.</p>
        <button id="return-btn" class="btn-pill btn-pill--outlined" aria-label="Return to dashboard">Return to dashboard</button>
    </div>

    <!-- Error overlay -->
    <div id="session-error" class="session-error">
        <h2 id="error-title" class="session-error__title">Error</h2>
        <p id="error-message" class="session-error__message">Something went wrong.</p>
        <button id="retry-btn" class="btn-pill btn-pill--outlined" aria-label="Try again">Try again</button>
    </div>

    <script type="module" src="/js/pages/liveSession.js"></script>
</body>
</html>
