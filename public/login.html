<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROC Academy - Login</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="theme-color" content="#001D4E">
<style>
@font-face {
  font-family: 'Geist';
  src: url('/fonts/Geist-Regular.woff2') format('woff2');
  font-weight: 400;
  font-display: swap;
}
@font-face {
  font-family: 'Geist';
  src: url('/fonts/Geist-Medium.woff2') format('woff2');
  font-weight: 500;
  font-display: swap;
}
@font-face {
  font-family: 'Geist';
  src: url('/fonts/Geist-Bold.woff2') format('woff2');
  font-weight: 700;
  font-display: swap;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --navy: #001D4E;
  --cobalt: #0051C2;
  --cobalt-hover: #003d91;
  --sky: #F4F7FE;
  --mint: #00e0b8;
  --white: #ffffff;
  --gray: #6c757d;
  --red: #dc3545;
  --radius: 6px;
  --font: 'Geist', system-ui, -apple-system, sans-serif;
}
html, body { height: 100%; }
body {
  font-family: var(--font);
  background: var(--sky);
  color: var(--navy);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.login-card {
  width: 100%;
  max-width: 400px;
  padding: 48px 40px 40px;
  background: var(--white);
  border: 1px solid rgba(0, 29, 78, 0.08);
  border-radius: var(--radius);
  box-shadow: 0 1px 3px rgba(0, 29, 78, 0.08), 0 8px 40px rgba(0, 29, 78, 0.06);
  position: relative;
}
.brand {
  text-align: center;
  margin-bottom: 8px;
}
.brand-logo {
  width: 80px;
  height: 80px;
  margin: 0 auto 16px;
  border: 2px solid var(--navy);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}
.brand-logo-text {
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 2px;
  color: var(--navy);
}
.brand-name {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--navy);
  letter-spacing: 0.5px;
}
.brand-sub {
  font-size: 0.75rem;
  font-weight: 400;
  font-style: italic;
  color: var(--gray);
  margin-top: 2px;
  margin-bottom: 28px;
}
.field {
  margin-bottom: 16px;
}
.field label {
  display: block;
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--navy);
  margin-bottom: 6px;
}
.field input {
  width: 100%;
  padding: 12px 14px;
  background: var(--white);
  border: 1px solid rgba(0, 29, 78, 0.2);
  border-radius: var(--radius);
  color: var(--navy);
  font-family: var(--font);
  font-size: 0.9rem;
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.field input:focus {
  border-color: var(--cobalt);
  box-shadow: 0 0 0 0.2rem rgba(0, 81, 194, 0.25);
}
.login-btn {
  width: 100%;
  padding: 12px;
  margin-top: 8px;
  background: var(--cobalt);
  border: none;
  border-radius: var(--radius);
  color: white;
  font-family: var(--font);
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  transition: background-color 0.15s, transform 0.1s;
}
.login-btn:hover {
  background: var(--cobalt-hover);
}
.login-btn:active {
  transform: scale(0.98);
}
.login-btn:disabled {
  opacity: 0.5;
  cursor: default;
  transform: none;
}
.forgot-hint {
  text-align: center;
  margin-top: 16px;
  font-size: 0.75rem;
  color: var(--gray);
}
.error-msg {
  display: none;
  margin-top: 14px;
  padding: 10px 14px;
  background: rgba(220, 53, 69, 0.08);
  border: 1px solid rgba(220, 53, 69, 0.2);
  border-radius: var(--radius);
  color: var(--red);
  font-size: 0.82rem;
  font-weight: 500;
  text-align: center;
}
.error-msg.visible {
  display: block;
  animation: fadeIn 0.15s ease;
}
.footer-brand {
  margin-top: 40px;
  text-align: center;
  font-size: 0.7rem;
  font-weight: 600;
  color: rgba(0, 29, 78, 0.3);
  letter-spacing: 1px;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>
<div class="login-card">
  <div class="brand">
    <div class="brand-logo"><span class="brand-logo-text">payroc</span></div>
    <div class="brand-name">ROC Academy</div>
    <div class="brand-sub">Built for the people who build people</div>
  </div>
  <form id="loginForm">
    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" autocomplete="username" required autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="login-btn" id="loginBtn">Sign In</button>
    <p class="forgot-hint">Forgot password? Contact your administrator.</p>
    <div class="error-msg" id="errorMsg"></div>
  </form>
</div>
<div class="footer-brand">payroc</div>
<script src="js/api.js"></script>
<script>
// If already authenticated, redirect to app
if (API.getToken()) {
  window.location.href = '/';
}

document.getElementById('loginForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const errorEl = document.getElementById('errorMsg');
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;

  if (!username || !password) return;

  btn.disabled = true;
  btn.textContent = 'Signing in...';
  errorEl.classList.remove('visible');

  try {
    await API.login(username, password);
    window.location.href = '/';
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.classList.add('visible');
    btn.disabled = false;
    btn.textContent = 'Sign In';
  }
});
</script>
</body>
</html>
