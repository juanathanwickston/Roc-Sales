<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROC Academy - Login</title>
<style>
@font-face {
  font-family: 'Geist';
  src: url('/fonts/Geist-Regular.woff2') format('woff2');
  font-weight: 400;
  font-display: swap;
}
@font-face {
  font-family: 'Geist';
  src: url('/fonts/Geist-Medium.woff2') format('woff2');
  font-weight: 500;
  font-display: swap;
}
@font-face {
  font-family: 'Geist';
  src: url('/fonts/Geist-Bold.woff2') format('woff2');
  font-weight: 700;
  font-display: swap;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --navy: #080E1A;
  --surface: #0D1526;
  --surface2: #131D35;
  --border: rgba(0, 180, 255, 0.12);
  --blue: #00B4FF;
  --blue2: #0088CC;
  --cyan: #00E5FF;
  --green: #00FF88;
  --red: #FF4466;
  --white: #EDF2FF;
  --gray: #6B7A99;
  --radius: 18px;
  --font: 'Geist', system-ui, -apple-system, sans-serif;
}
html, body { height: 100%; }
body {
  font-family: var(--font);
  background: var(--navy);
  color: var(--white);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
body::before {
  content: '';
  position: fixed;
  width: 600px;
  height: 600px;
  top: -200px;
  left: -200px;
  background: radial-gradient(circle, rgba(0, 180, 255, 0.06), transparent 70%);
  pointer-events: none;
}
body::after {
  content: '';
  position: fixed;
  width: 500px;
  height: 500px;
  bottom: -200px;
  right: -200px;
  background: radial-gradient(circle, rgba(170, 85, 255, 0.04), transparent 70%);
  pointer-events: none;
}
.login-card {
  width: 100%;
  max-width: 400px;
  padding: 40px 32px;
  background: linear-gradient(145deg, var(--surface2), var(--surface));
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5), 0 0 40px rgba(0, 180, 255, 0.05);
  position: relative;
  overflow: hidden;
}
.login-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--blue), var(--cyan), var(--blue));
  opacity: 0.6;
}
.brand {
  text-align: center;
  margin-bottom: 32px;
}
.brand-name {
  font-size: 1.8rem;
  font-weight: 700;
  letter-spacing: 3px;
  background: linear-gradient(135deg, var(--cyan), var(--blue));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}
.brand-sub {
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 4px;
  color: var(--gray);
  margin-top: 4px;
  text-transform: uppercase;
}
.field {
  margin-bottom: 18px;
}
.field label {
  display: block;
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--gray);
  margin-bottom: 6px;
}
.field input {
  width: 100%;
  padding: 14px 16px;
  background: var(--navy);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--white);
  font-family: var(--font);
  font-size: 0.9rem;
  outline: none;
  transition: border-color 0.25s;
}
.field input:focus {
  border-color: rgba(0, 180, 255, 0.4);
}
.login-btn {
  width: 100%;
  padding: 16px;
  margin-top: 8px;
  background: linear-gradient(135deg, var(--blue2), var(--blue));
  border: none;
  border-radius: 10px;
  color: white;
  font-family: var(--font);
  font-size: 0.95rem;
  font-weight: 700;
  letter-spacing: 0.5px;
  cursor: pointer;
  transition: all 0.3s;
}
.login-btn:hover {
  box-shadow: 0 6px 30px rgba(0, 180, 255, 0.25);
  transform: translateY(-2px);
}
.login-btn:disabled {
  opacity: 0.5;
  cursor: default;
  transform: none;
  box-shadow: none;
}
.error-msg {
  display: none;
  margin-top: 14px;
  padding: 12px 16px;
  background: rgba(255, 68, 102, 0.06);
  border: 1px solid rgba(255, 68, 102, 0.2);
  border-radius: 8px;
  color: var(--red);
  font-size: 0.82rem;
  font-weight: 500;
  text-align: center;
}
.error-msg.visible {
  display: block;
  animation: fadeIn 0.3s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>
<div class="login-card">
  <div class="brand">
    <div class="brand-name">ROC ACADEMY</div>
    <div class="brand-sub">Sales Training Platform</div>
  </div>
  <form id="loginForm">
    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" autocomplete="username" required autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="login-btn" id="loginBtn">Sign In</button>
    <div class="error-msg" id="errorMsg"></div>
  </form>
</div>
<script src="js/api.js"></script>
<script>
// If already authenticated, redirect to app
if (API.getToken()) {
  window.location.href = '/';
}

document.getElementById('loginForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const errorEl = document.getElementById('errorMsg');
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;

  if (!username || !password) return;

  btn.disabled = true;
  btn.textContent = 'Signing in...';
  errorEl.classList.remove('visible');

  try {
    await API.login(username, password);
    window.location.href = '/';
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.classList.add('visible');
    btn.disabled = false;
    btn.textContent = 'Sign In';
  }
});
</script>
</body>
</html>
